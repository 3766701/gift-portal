<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>礼包后台</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="common/layui/css/layui.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="admin-shell">
    <header class="admin-header">
      <div><strong>DROP//ZONE</strong><span>后台系统</span></div>
      <button id="logout" class="layui-btn layui-btn-primary" type="button" hidden>退出</button>
    </header>

    <section id="login-view" class="login-view">
      <form id="login-form" class="login-form">
        <h1>后台登录</h1>
        <label for="admin-username">后台账号</label>
        <input id="admin-username" class="layui-input" autocomplete="username" required>
        <label for="admin-password">后台密码</label>
        <input id="admin-password" class="layui-input" type="password" autocomplete="current-password" required>
        <button class="layui-btn" type="submit">登录</button>
        <p id="login-message" class="form-message"></p>
      </form>
    </section>

    <section id="admin-view" hidden>
      <div class="admin-layout">
        <aside class="admin-nav" aria-label="后台导航">
          <button class="nav-item is-active" type="button" data-view="import-view">导入库存</button>
          <button class="nav-item" type="button" data-view="inventory-view">库存管理</button>
          <button class="nav-item" type="button" data-view="claims-view">领取记录</button>
          <button class="nav-item" type="button" data-view="system-logs-view">系统日志</button>
        </aside>
        <div class="admin-content">
          <section id="import-view" class="admin-page">
              <section class="import-card admin-card">
          <form id="inventory-import-form" class="inventory-form">
          <h1>导入库存</h1>
          <p class="import-format">每行一条：录入人|商品名称|SOOP Cookie（支持 Cookie 文本或 JSON；账号自动从 BbsTicket 提取）</p>
          <textarea id="inventory-import-text" class="layui-textarea import-text" rows="13" placeholder="张三|PUBG 补给箱|cookie_name=cookie_value; ..." required></textarea>
          <button class="layui-btn" type="submit">导入库存</button>
          <p id="inventory-message" class="form-message"></p>
          <div id="generated-codes" class="generated-codes" hidden>
            <div class="generated-codes-title"><strong>商品名----卡密----提卡链接</strong><button id="copy-generated-codes" class="layui-btn layui-btn-primary" type="button">一键复制</button></div>
            <textarea id="generated-codes-text" class="layui-textarea code-output" readonly></textarea>
          </div>
          </form>
              </section>
          </section>

          <section id="inventory-view" class="admin-page" hidden>
              <section class="admin-card inventory-card">
          <div class="panel-title"><h1>库存与激活码</h1><div class="panel-tools"><input id="inventory-search" class="layui-input search-input" placeholder="搜索商品、账号、激活码、录入人"><button id="inventory-search-button" class="layui-btn" type="button">搜索</button><button id="refresh" class="layui-btn layui-btn-primary" type="button">刷新</button></div></div>
          <div class="table-wrap">
            <table class="inventory-table">
              <thead><tr><th>ID</th><th>商品</th><th>SOOP 账号</th><th>录入人</th><th>录入时间</th><th>激活码</th><th>状态</th><th>操作</th></tr></thead>
              <tbody id="inventory-body"></tbody>
            </table>
          </div>
          <p id="table-message" class="form-message"></p>
          <div id="inventory-pagination" class="pagination"></div>
              </section>
          </section>

          <section id="claims-view" class="admin-page" hidden>
            <section class="admin-card claims-card">
          <div class="panel-title"><h1>领取记录</h1><div class="panel-tools"><input id="claims-search" class="layui-input search-input" placeholder="搜索激活码、领取账号、商品"><button id="claims-search-button" class="layui-btn" type="button">搜索</button><button id="refresh-claims" class="layui-btn layui-btn-primary" type="button">刷新</button></div></div>
          <div class="table-wrap">
            <table class="inventory-table">
              <thead><tr><th>ID</th><th>激活码</th><th>领取账号</th><th>商品</th><th>SOOP 账号</th><th>领取时间</th></tr></thead>
              <tbody id="claims-body"></tbody>
            </table>
          </div>
          <p id="claims-message" class="form-message"></p>
          <div id="claims-pagination" class="pagination"></div>
            </section>
          </section>

          <section id="system-logs-view" class="admin-page" hidden>
            <section class="admin-card system-logs-card">
              <div class="panel-title"><h1>系统日志</h1><div class="panel-tools"><input id="system-logs-search" class="layui-input search-input" placeholder="搜索级别、模块或日志内容"><button id="system-logs-search-button" class="layui-btn" type="button">搜索</button><button id="refresh-system-logs" class="layui-btn layui-btn-primary" type="button">刷新</button></div></div>
              <div class="table-wrap">
                <table class="inventory-table system-logs-table">
                  <thead><tr><th>级别</th><th>模块</th><th>摘要</th><th>时间</th><th>操作</th></tr></thead>
                  <tbody id="system-logs-body"></tbody>
                </table>
              </div>
              <p id="system-logs-message" class="form-message"></p>
              <div id="system-logs-pagination" class="pagination"></div>
            </section>
          </section>
        </div>
      </div>
    </section>
  </main>
  <dialog id="system-log-detail-dialog" class="log-detail-dialog" aria-labelledby="system-log-detail-title">
    <div class="log-detail-header"><h2 id="system-log-detail-title">系统日志详情</h2><button id="close-system-log-detail" class="dialog-close" type="button" aria-label="关闭">×</button></div>
    <dl class="log-detail-meta"><div><dt>级别</dt><dd id="system-log-detail-level"></dd></div><div><dt>模块</dt><dd id="system-log-detail-module"></dd></div><div><dt>时间</dt><dd id="system-log-detail-time"></dd></div></dl>
    <section class="log-detail-section"><h3>摘要</h3><pre id="system-log-detail-message"></pre></section>
    <section class="log-detail-section"><h3>异常堆栈</h3><pre id="system-log-detail-trace"></pre></section>
  </dialog>
  <script src="admin.js"></script>
</body>
</html>
