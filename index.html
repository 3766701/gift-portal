<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>PUBG礼包提货</title>
  <link rel="stylesheet" href="common/layui/css/layui.css"><link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" class="layui-container">
<div id="centerdiv" class="layui-tab layui-tab-card layui-row">
  <ul class="layui-tab-title" id="tabs"><li data-tab="global">全球提货</li><li data-tab="steam" class="layui-this">steam提货</li><li data-tab="qr">令牌扫码提货</li><li data-tab="orders">订单查询</li></ul>
  <div class="layui-tab-content" style="overflow-x:hidden">
    <div class="layui-tab-item" data-panel="global"><form class="layui-form"><div class="layui-form-item"><label class="layui-form-label">激活码</label><div class="layui-input-block"><input class="layui-input" placeholder="请输入激活码"></div></div><div class="layui-form-item"><label class="layui-form-label">游戏 UID</label><div class="layui-input-block"><input class="layui-input" placeholder="请输入游戏 UID"></div></div><div class="layui-form-item"><div class="layui-input-block"><button class="layui-btn" type="button">立即提交</button><button class="layui-btn" type="button">查询结果</button></div></div></form><div class="layui-card lower-card"></div></div>
    <div class="layui-tab-item layui-show" data-panel="steam"><form class="layui-form" id="redeem-form"><div class="layui-input-inline"></div><div class="layui-form-item"><label class="layui-form-label">激活码</label><div class="layui-input-block"><input type="text" id="code" required placeholder="请输入激活码" autocomplete="off" class="layui-input"><button type="button" id="paste" class="paste">粘贴</button></div></div><div class="layui-form-item"><label class="layui-form-label">游戏 UID</label><div class="layui-input-block"><input type="text" id="player-id" required placeholder="请输入游戏 UID" autocomplete="off" class="layui-input"></div></div><div class="layui-form-item"><label class="layui-form-label">角色名</label><div class="layui-input-block"><input type="text" id="player-name" placeholder="请输入角色名" autocomplete="off" class="layui-input"></div></div><div class="layui-form-item"><div class="layui-input-block"><button class="layui-btn" type="submit">立即提交</button><button class="layui-btn" id="check-order-short" type="button">查询结果</button></div></div><div class="layui-form-item" id="progress-steam" style="display:none"><label class="layui-form-label">处理进度</label><div class="layui-input-block progress-block"><div class="layui-progress layui-progress-big"><div class="layui-progress-bar layui-bg-blue" id="progress-bar"></div></div></div></div><p id="form-message" class="result"></p></form><div class="layui-card lower-card"><div id="steam-content"></div></div></div>
    <div class="layui-tab-item" data-panel="qr"><form class="layui-form"><div class="layui-form-item"><label class="layui-input-block qr-result" id="qr-result"></label></div><div class="layui-form-item"><label class="layui-form-label">激活码</label><div class="layui-input-block"><input id="qr-code" required placeholder="输入激活码再生成二维码" class="layui-input"></div></div><div class="layui-form-item"><div class="layui-input-block"><div id="qr-box" class="qr-box"></div></div></div><div class="layui-form-item"><div class="layui-input-block"><button class="layui-btn" type="button" id="generate-qr">生成二维码</button><button class="layui-btn" type="button" id="query-qr">查询结果</button></div></div></form><div class="layui-card lower-card"></div></div>
    <div class="layui-tab-item" data-panel="orders"><form class="layui-form"><div class="layui-form-item"><label class="layui-input-block qr-result" id="order-result"></label></div><div class="layui-form-item"><label class="layui-form-label">激活码</label><div class="layui-input-block"><input id="order-id" required placeholder="请输入激活码" class="layui-input"></div></div><div class="layui-form-item"><div class="layui-input-block"><button class="layui-btn" type="button" id="query-order">查询结果</button></div></div><div class="layui-form-item" id="history-row" style="display:none"><label class="layui-form-label">激活记录</label><div class="layui-input-block"><table id="history"></table></div></div></form><div class="layui-card lower-card"></div></div>
  </div>
</div></div>
<script src="app.js"></script>
</body></html>
